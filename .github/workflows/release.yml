# Builds the rsb0t program (rsb0t-go, said "RS bot go") for each platform when a version tag (v1.2.3) is pushed, and attaches the
# archives to a GitHub Release. Nothing here runs until the repository exists and a tag is pushed.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: |
          set -e
          mkdir dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=rsb0t-go_${GITHUB_REF_NAME}_${os}_${arch}
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "dist/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/rsb0t$ext" ./cmd/rsb0t
            cp README.md LICENSE settings.example.json fleet.config.example.json "dist/$name/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name"); else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
